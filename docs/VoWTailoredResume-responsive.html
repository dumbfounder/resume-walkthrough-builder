<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VoWTailoredResume Responsive</title>
<style>
:root {
  --bg: #eeece7;
  --paper: #fffdfa;
  --ink: #1f252b;
  --muted: #626b73;
  --faint: #8b9298;
  --line: #d8d2c7;
  --accent: #1f6469;
  --accent-2: #a56e1f;
  --accent-soft: #e5f0ee;
  --highlight: #fdeca8;
  --shadow: 0 28px 90px rgba(31, 37, 43, .18);
  --risk: #a23b36;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html,
body {
  width: 100%;
  max-width: 100%;
}
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.48;
  overflow-x: hidden;
}
button { font: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid rgba(31, 100, 105, .3); outline-offset: 2px; }
.shell {
  min-height: 100vh;
  padding: 22px clamp(16px, 3vw, 42px) 42px;
}
.topbar {
  position: sticky;
  top: 14px;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: min(90vw, 1600px);
  margin: 0 auto 18px;
  border: 1px solid rgba(31, 37, 43, .12);
  border-radius: 18px;
  background: rgba(255, 253, 250, .92);
  box-shadow: 0 12px 36px rgba(31, 37, 43, .12);
  padding: 11px 12px 11px 16px;
  backdrop-filter: blur(18px);
}
.context { min-width: 0; }
.context strong {
  display: block;
  color: var(--accent);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.context span {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted);
  font-size: 13px;
}
.top-actions { display: flex; align-items: center; gap: 8px; }
.pill-button {
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fffdfa;
  color: var(--ink);
  padding: 8px 12px;
  cursor: pointer;
}
.pill-button.primary, .pill-button.active {
  border-color: var(--accent);
  background: var(--accent);
  color: white;
}
.stage {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
  gap: clamp(18px, 2.4vw, 32px);
  align-items: start;
  justify-content: stretch;
  width: min(90vw, 1600px);
  margin: 0 auto;
}
.resume-wrap { position: relative; min-width: 0; }
.walkthrough-wrap {
  position: sticky;
  top: 92px;
  min-width: 0;
  display: grid;
  gap: 14px;
  align-content: start;
  align-self: start;
  max-height: calc(100dvh - 112px);
}
.version-labels {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 12px;
}
.version-labels span {
  border: 1px solid rgba(31, 37, 43, .12);
  border-radius: 999px;
  background: rgba(255,253,250,.72);
  padding: 5px 10px;
}
.version-labels .after { opacity: 0; transform: translateY(4px); transition: opacity .35s ease, transform .35s ease; }
.is-tour .version-labels .before { opacity: .55; }
.is-tour .version-labels .after { opacity: 1; transform: none; }
.resume-paper {
  position: relative;
  overflow: hidden;
  min-height: 1040px;
  border: 1px solid rgba(31, 37, 43, .13);
  background: var(--paper);
  box-shadow: var(--shadow);
  padding: clamp(38px, 5vw, 62px);
  transition: box-shadow .35s ease, transform .35s ease;
}
.resume-paper::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 8px;
  background: linear-gradient(180deg, var(--accent), var(--accent-2));
}
.is-tour .resume-paper { transform: none; }
.resume-header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(190px, 280px);
  gap: 22px;
  align-items: end;
  border-bottom: 2px solid rgba(31, 37, 43, .8);
  padding-bottom: 20px;
  margin-bottom: 18px;
}
.resume-kicker {
  margin: 0 0 9px;
  color: var(--accent);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .14em;
  text-transform: uppercase;
}
h1 {
  margin: 0;
  font-size: clamp(38px, 5.2vw, 58px);
  line-height: .98;
  letter-spacing: 0;
}
.resume-headline {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  text-align: right;
}
.contact {
  margin: 0 0 18px;
  color: var(--muted);
  font-size: 13px;
}
.summary {
  margin: 0 0 20px;
  max-width: 69ch;
  color: #303942;
  font-size: 15.5px;
}
.resume-section { margin-top: 20px; }
.resume-section h2 {
  margin: 0 0 10px;
  color: #697079;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .11em;
  text-transform: uppercase;
}
.line {
  position: relative;
  margin: 0 0 7px;
  color: #29323b;
  font-size: 14.8px;
  transition: opacity .28s ease, filter .28s ease, transform .28s ease, color .28s ease;
}
.line.bullet { padding-left: 18px; }
.line.bullet::before {
  content: "";
  position: absolute;
  left: 0;
  top: .66em;
  width: 5px;
  height: 5px;
  border-radius: 999px;
  background: var(--accent);
}
.is-tour .line.dim, .is-tour .resume-section.dim-section h2 {
  opacity: .27;
  filter: grayscale(.55);
}
.is-tour .line.focus {
  z-index: 2;
  color: #101820;
  transform: translateX(4px);
}
.line mark {
  border-radius: 6px;
  background: linear-gradient(180deg, rgba(253,236,168,.55), rgba(253,236,168,.95));
  color: inherit;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
  box-shadow: 0 0 0 4px rgba(253, 236, 168, .42), 0 14px 36px rgba(31, 37, 43, .17);
  padding: 1px 2px;
}
.resume-key {
  color: #111820;
  font-weight: 850;
}
.coach {
  position: relative;
  top: auto;
  align-self: start;
  width: 100%;
  min-width: 0;
  max-height: calc(100dvh - 112px);
  overflow: auto;
  overscroll-behavior: contain;
  opacity: 0;
  transform: translateY(12px);
  pointer-events: none;
  transition: opacity .35s ease, transform .35s ease;
}
.is-tour .coach { opacity: 1; transform: none; pointer-events: auto; }
.is-start .coach { display: none; }
.coach-card {
  position: relative;
  width: 100%;
  min-width: 0;
  border: 1px solid rgba(31, 100, 105, .22);
  border-radius: 22px;
  background: rgba(255, 253, 250, .97);
  box-shadow: 0 28px 80px rgba(31, 37, 43, .22);
  padding: 18px 18px 24px;
}
.coach-card::before {
  content: "";
  position: absolute;
  left: -11px;
  top: 72px;
  width: 20px;
  height: 20px;
  border-left: 1px solid rgba(31, 100, 105, .22);
  border-bottom: 1px solid rgba(31, 100, 105, .22);
  background: rgba(255, 253, 250, .97);
  transform: rotate(45deg);
}
.coach-top {
  position: sticky;
  top: 0;
  z-index: 4;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  background: rgba(255, 253, 250, .98);
  border-bottom: 1px solid rgba(31, 37, 43, .1);
  margin: -18px -18px 13px;
  padding: 18px 18px 12px;
  border-radius: 22px 22px 0 0;
  backdrop-filter: blur(14px);
}
.step-count {
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.step-buttons { display: flex; flex-shrink: 0; gap: 8px; }
.step-buttons button {
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--paper);
  min-width: 58px;
  padding: 8px 12px;
  cursor: pointer;
}
.step-buttons button.next { border-color: var(--accent); background: var(--accent); color: white; }
.step-buttons button:disabled { opacity: .45; cursor: not-allowed; }
.eyebrow-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  color: var(--accent);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.eyebrow-row span:first-child {
  min-width: 0;
  overflow-wrap: anywhere;
}
.confidence {
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  padding: 4px 9px;
  white-space: nowrap;
}
.coach h2 {
  margin: 0 0 10px;
  font-size: clamp(26px, 2.6vw, 38px);
  line-height: 1.04;
  overflow-wrap: anywhere;
}
.narrative {
  margin: 0 0 14px;
  color: #303942;
  font-size: 16.5px;
  overflow-wrap: anywhere;
}
.insights { display: grid; gap: 9px; }
.insight {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fbf8f1;
  padding: 12px;
}
.insight.caveat { border-left: 4px solid var(--accent-2); }
.insight strong { display: block; margin-bottom: 4px; font-size: 13px; }
.insight p { margin: 0; color: #3a434b; font-size: 14px; }
.source-box {
  margin-top: 12px;
  border-left: 4px solid var(--accent);
  border-radius: 12px;
  background: var(--accent-soft);
  padding: 11px 12px;
}
.source-box summary {
  cursor: pointer;
  color: var(--accent);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.source-box p { margin: 7px 0 0; color: #25363a; font-size: 14px; }
.terms-box {
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fffdf8;
  padding: 10px 12px;
}
.terms-box summary {
  cursor: pointer;
  color: var(--accent);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.terms-box dl {
  display: grid;
  gap: 8px;
  margin: 10px 0 0;
}
.terms-box dt {
  color: #182127;
  font-size: 13px;
  font-weight: 800;
}
.terms-box dd {
  margin: 2px 0 0;
  color: #3b444c;
  font-size: 13px;
}
.nav-dots {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 13px;
  padding-bottom: 6px;
}
.nav-dots button {
  width: 34px;
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--paper);
  cursor: pointer;
}
.nav-dots button.active { border-color: var(--accent); background: var(--accent); color: white; }
.launch {
  width: 100%;
  margin: 0;
  border: 1px solid rgba(31, 100, 105, .22);
  border-radius: 22px;
  background: rgba(255, 253, 250, .95);
  box-shadow: 0 24px 80px rgba(31, 37, 43, .2), 0 0 0 6px rgba(31, 100, 105, .06);
  padding: 22px;
  transform: translateY(0) scale(1);
  transition: opacity .28s ease, transform .28s ease, box-shadow .28s ease;
}
.launch strong { display: block; margin-bottom: 8px; font-size: 18px; line-height: 1.25; }
.launch p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
.launch .pill-button { font-weight: 800; }
.prompt-visible .launch { transform: translateY(0) scale(1.02); }
.is-tour .launch, .mode-brief .launch { display: none; }
.brief {
  display: none;
  width: min(900px, 100%);
  margin: 0 auto;
}
.mode-brief .stage { display: none; }
.mode-brief .brief { display: grid; gap: 14px; }
.mode-resume .coach,
.mode-resume .launch,
.mode-resume .brief {
  display: none;
}
.mode-resume .resume-paper {
  transform: none;
}
.brief-card {
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(255, 253, 250, .94);
  box-shadow: 0 18px 54px rgba(31, 37, 43, .1);
  padding: 24px;
}
.brief-card h2, .brief-card h3 { margin: 0 0 8px; }
.brief-card p, .brief-card li { color: #374049; }
@media (max-width: 720px) {
  html,
  body,
  #root {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }
  body {
    background: #f2f0eb;
  }
  #root * {
    max-width: 100%;
  }
  .shell {
    width: 100%;
    max-width: 100vw;
    margin: 0 auto;
    overflow-x: hidden;
    padding: 10px 10px max(22px, env(safe-area-inset-bottom));
  }
  .is-start .shell {
    padding-bottom: max(22px, env(safe-area-inset-bottom));
  }
  .is-tour .shell {
    height: 100dvh;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    overflow: hidden;
  }
  .topbar {
    position: sticky;
    top: 8px;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: stretch;
    gap: 10px;
    width: 100%;
    max-width: none;
    margin-bottom: 10px;
    border-radius: 16px;
    padding: 10px;
    overflow: hidden;
  }
  .context,
  .top-actions,
  .stage,
  .resume-wrap,
  .walkthrough-wrap,
  .resume-paper,
  .coach,
  .coach-card {
    min-width: 0;
  }
  .is-tour .topbar {
    position: relative;
    top: 0;
  }
  .context strong {
    font-size: 10px;
  }
  .context span {
    max-width: 100%;
    font-size: 12px;
  }
  .top-actions {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 7px;
    width: 100%;
    min-width: 0;
  }
  .top-actions [data-save-pdf] {
    grid-column: 1 / -1;
  }
  .pill-button {
    min-height: 42px;
    padding: 8px 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .stage {
    display: block;
    width: 100%;
    max-width: none;
    overflow-x: hidden;
  }
  .is-start .stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
  }
  .is-start .walkthrough-wrap {
    position: relative;
    top: auto;
    max-height: none;
    order: -1;
  }
  .is-tour .stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
    height: 100%;
    max-width: calc(100vw - 20px);
    min-height: 0;
    overflow: hidden;
  }
  .version-labels { display: none; }
  .resume-wrap,
  .walkthrough-wrap,
  .resume-paper {
    width: 100%;
    max-width: none;
    overflow-x: hidden;
  }
  .is-tour .resume-wrap,
  .is-tour .walkthrough-wrap {
    max-width: none;
    height: 100%;
    max-height: 100%;
    min-height: 0;
    overflow: hidden;
  }
  .is-tour .resume-wrap {
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  .is-tour .walkthrough-wrap {
    position: relative;
    top: auto;
    height: 100%;
    display: block;
    max-height: 100%;
  }
  .resume-paper {
    min-height: 0;
    width: 100%;
    box-shadow: 0 14px 42px rgba(31, 37, 43, .14);
    padding: 28px 20px 30px 24px;
  }
  .resume-paper p,
  .resume-paper li,
  .resume-paper h1,
  .coach-card p,
  .coach-card h2,
  .coach-card strong {
    overflow-wrap: anywhere;
    word-break: normal;
  }
  .resume-paper::before {
    width: 6px;
  }
  .resume-header { display: block; }
  .resume-kicker {
    font-size: 10px;
    letter-spacing: .12em;
  }
  h1 {
    font-size: clamp(36px, 14vw, 50px);
  }
  .resume-headline {
    margin-top: 8px;
    font-size: 13px;
    text-align: left;
    overflow-wrap: anywhere;
  }
  .contact {
    font-size: 12.5px;
  }
  .summary {
    font-size: 14.5px;
    overflow-wrap: anywhere;
  }
  .resume-section {
    margin-top: 18px;
  }
  .resume-section h2 {
    font-size: 10.5px;
    letter-spacing: .09em;
  }
  .line {
    font-size: 13.8px;
    line-height: 1.48;
    overflow-wrap: anywhere;
  }
  .line.bullet {
    padding-left: 15px;
  }
  .is-tour .line.dim, .is-tour .resume-section.dim-section h2 {
    opacity: .36;
  }
  .is-tour .line.focus {
    transform: none;
  }
  .line mark {
    box-shadow: 0 0 0 3px rgba(253, 236, 168, .5), 0 10px 24px rgba(31, 37, 43, .14);
  }
  .coach {
    left: 8px;
    bottom: max(8px, env(safe-area-inset-bottom));
    width: min(370px, calc(100vw - 16px));
    max-width: min(370px, calc(100vw - 16px));
    max-height: 54dvh;
    transform: translateY(18px);
    overflow-x: hidden;
  }
  .is-tour .coach { transform: none; }
  .is-tour .coach {
    position: relative;
    inset: auto;
    width: 100%;
    max-width: none;
    height: 100%;
    max-height: none;
    overflow: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  .coach-card {
    width: 100%;
    max-width: 100%;
    border-radius: 20px;
    box-shadow: 0 -12px 48px rgba(31, 37, 43, .24);
    padding: 14px;
    overflow-x: hidden;
  }
  .is-tour .coach-card {
    min-height: 100%;
    background: #fffdfa;
    box-shadow: 0 10px 32px rgba(31, 37, 43, .18);
  }
  .coach h2 {
    font-size: 25px;
    overflow-wrap: anywhere;
  }
  .coach-top {
    position: sticky;
    top: 0;
    z-index: 2;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 8px;
    align-items: stretch;
    background: rgba(255, 253, 250, .97);
    margin: -14px -14px 12px;
    padding: 12px 14px;
    border-radius: 20px 20px 0 0;
  }
  .step-count {
    overflow: visible;
    text-overflow: clip;
    white-space: normal;
  }
  .step-buttons button {
    min-height: 40px;
    padding: 7px 12px;
  }
  .step-count {
    white-space: nowrap;
  }
  .step-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    width: 100%;
  }
  .step-buttons button {
    min-width: 0;
  }
  .eyebrow-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: flex-start;
    font-size: 10px;
  }
  .confidence {
    justify-self: start;
    margin-top: 6px;
  }
  .narrative {
    font-size: 15px;
    overflow-wrap: anywhere;
  }
  .insight {
    padding: 10px;
  }
  .insight p,
  .source-box p {
    font-size: 13px;
  }
  .nav-dots {
    display: none;
  }
  .nav-dots button {
    width: 38px;
    height: 38px;
  }
  .launch {
    width: 100%;
    max-width: 370px;
    margin: 0 0 12px;
    border-radius: 18px;
    padding: 16px;
  }
  .prompt-visible .launch { transform: scale(1.01); }
  .launch p {
    font-size: 13px;
  }
  .brief {
    width: 100%;
  }
  .brief-card {
    border-radius: 16px;
    padding: 18px;
  }
}
@media print {
  body { background: #fff; }
  .topbar, .coach, .launch, .version-labels, .brief { display: none !important; }
  .shell { padding: 0; }
  .stage { display: block; width: 100%; }
  .resume-paper { min-height: 0; box-shadow: none; border: 0; padding: 0; }
  .line, .resume-section h2 { opacity: 1 !important; filter: none !important; transform: none !important; }
  .line mark { background: transparent; box-shadow: none; padding: 0; }
}
</style>
</head>
<body>
<div id="root"></div>
<script id="data" type="application/json">{"model":{"candidateName":"Chris Seline","candidateHeadline":"AI Platforms • Search & Retrieval • Data Architecture • Enterprise Intelligence Systems","polishedResume":{"name":"Chris Seline","headline":"Technical Founder & AI/Data Platform Architect | Search, Retrieval, Data Fusion, Enterprise Intelligence","contactLine":"Washington, DC • 703-203-4145 • chris@seline.org","summary":"Innovation-focused technical leader and founder with 25+ years building large-scale search engines, data platforms, AI/ML applications, analytics systems, and distributed infrastructure. Experienced in taking complex technical concepts from prototype to operating product, including venture-backed companies, enterprise data platforms, search and retrieval systems, graph-oriented analytics, entity resolution, geospatial intelligence, and decentralized encryption. Has led teams across startups and larger public-company environments while staying hands-on in architecture, algorithms, data pipelines, and platform execution.","sections":[{"heading":"Executive Fit for AI, Search & Enterprise Intelligence Platforms","lines":["Built multiple search and intelligence products from the ground up, including web search, social search, Twitter image search, television search, topical social search, and enterprise data fusion platforms.","Recent independent work focuses on AI-assisted research systems, RAG platforms, evidence workbenches, entity resolution architectures, local-first AI orchestration, and healthcare/scientific evidence analysis.","Combines founder-level product ownership with deep systems architecture across ingestion, retrieval, analytics, graph analysis, NLP, machine learning, cloud infrastructure, and scalable data pipelines.","Raised approximately $6M across startups and has served as CEO, CTO, chief architect, director of engineering, product owner, and hands-on back-end systems builder."]},{"heading":"Professional Experience","lines":["Independent Consultant / AI Platform Architect — Self Employed | January 2024–Present","• Consult on enterprise AI systems, search and retrieval, entity resolution, advanced RAG infrastructure, and distributed analytics platforms.","• Designed AI-assisted research and evidence workbenches for large-scale corpus ingestion, retrieval orchestration, inspectable outputs, evidence comparison, and human-review workflows.","• Architected Tenure, a RAG platform for enterprise knowledge operationalization, conversational understanding of large corpora, context compression, and long-context AI interaction.","• Developed simulation-oriented AI systems using multi-pass retrieval, evidence fusion, calibration workflows, and inspectable reasoning pipelines for enterprise decision support.","• Created entity and identity resolution architectures across heterogeneous organizational and web datasets, graph-oriented enrichment, probabilistic matching, and scalable ingest pipelines.","Senior Lead Software Engineer — Capital One | December 2024–September 2025","• Led architecture and engineering initiatives supporting reconciliation and standardization of banking data across complex enterprise financial ecosystems.","• Architected scalable reconciliation and standardization pipelines for high-volume financial transaction processing.","• Designed event-driven and streaming-based processing systems to improve resiliency, consistency, and operational transparency.","• Built self-healing reconciliation workflows and streaming composition proof-of-concept systems for distributed financial data processing.","CEO & Chief Architect — Darkblock | March 2021–December 2024","• Founded and led a decentralized encryption and secure content distribution platform focused on blockchain-integrated access systems and digital ownership infrastructure.","• Raised approximately $1.85M from venture capital and angel investors while leading product, engineering, and platform strategy.","• Architected and authored the Darkblock Protocol, a decentralized encryption framework enabling secure content distribution, monetization, and trustless access control.","• Led a multidisciplinary engineering team across back-end systems, blockchain integration, encryption infrastructure, mobile applications, and front-end development.","• Drove product strategy, partnerships, fundraising, architecture, and operating execution in a rapidly evolving technical market.","Data Platform Architect / Engineering Manager — Everbridge | July 2018–March 2021","• Led architecture and engineering for enterprise analytics, data platform modernization, and cloud-native data infrastructure.","• Designed a Data Analytics Platform integrating Kafka, S3, AWS Glue, Snowflake, and Looker.","• Built ELT pipelines integrating data from diverse business units into centralized data lake and analytics infrastructure.","• Managed GRX platform architecture after the PlanetRisk acquisition, serving as product owner and engineering manager.","• Recognized as a “Top 1% Contributor” for GRX work.","Director of Engineering — PlanetRisk | February 2016–June 2018","• Led engineering for GRX, a data fusion SaaS platform combining search, graph analysis, geospatial analytics, and machine learning.","• Designed custom entity resolution algorithms across structured and unstructured datasets.","• Architected large-scale ingest systems for social media, news, geospatial data, investigative sources, and external intelligence feeds.","• Built geospatial intelligence systems designed to ingest billions of records daily and support query-time spatial analysis through map-based interfaces.","Co-Founder / CTO — DistilleryLab / PersoniFind | April 2013–February 2016","• Built PersoniFind, a topical social media user search engine covering more than 500 million users by analyzing over 40 billion social connections and tens of billions of social posts.","• Created a topical analysis engine and content tracking service using NLP and graph data analysis.","• Built APIs and web services powering analytics dashboards.","• Bootstrapped the company through custom analytics dashboards, generating $250K in revenue."]},{"heading":"Earlier Search, Data Mining & Startup Experience","lines":["Founder / President / CEO / CTO — Dumbfind, Searchles, Twicsy | 2003–2019","• Founded Twicsy, a Twitter picture search engine indexing over 10 billion pictures and 15 billion tweets, reaching more than 400 million total visits.","• Built Twicsy from concept to launch in 8 days and scaled it to more than 9 million unique visitors per month.","• Founded Dumbfind, an NLP and machine-learning-driven web search engine with a 300 million-page index built from homegrown infrastructure.","• Re-engineered the Brill parts-of-speech tagger and achieved a 10,000x speed improvement.","• Built Searchles, a social search engine combining bookmarking, networking, graph analysis, and user-generated search.","CTO — Void Star Creations | March 2012–March 2013","• Designed and implemented API and AWS infrastructure for an online social gaming platform.","Lead Developer — StreamSage / Comcast Labs | March 2010–March 2012","• Developed television search solutions for set-top boxes and web applications.","• Built a type-ahead suggested search prototype with sub-0.1ms latency.","Consultant — FreedomOSS / Standard & Poor’s | September 2009–October 2009","• Created a Hadoop, Pig, and Hive proof of concept for distributed financial data processing as a potential Oracle OLAP replacement.","Vice President of Research & Development — Cyveillance | August 2001–October 2003","• Managed developers building custom internet data mining applications, including web crawlers, search systems, p2p mining bots, and prototypes.","• Built systems for downloading and processing hundreds of millions of documents monthly.","Co-Founder / CTO — 2Wrongs.com | March 1999–August 2001","• Built a prototype bookmark-based full-text search engine and helped raise $2.6M in venture capital from firms including Draper Atlantic and Lazard Technology Partners.","• Helped grow the company to more than 20 employees and facilitated its sale to Cyveillance."]},{"heading":"Technical Depth","lines":["Search & Retrieval: web crawling, inverted indexes, SOLR, Elasticsearch, Lucene, OpenSearch, vector search, relevancy, clustering, PageRank-style algorithms, type-ahead search, recommendation systems.","AI, NLP & Analytics: RAG architectures, long-context interaction, evidence workbenches, NLP, graph analysis, entity and identity resolution, machine learning, topical analysis, simulation-oriented AI workflows.","Data Platforms: Kafka, Kafka Connect, Snowflake, AWS Glue, Athena, S3, Hadoop, Hive, Pig, Cassandra, Phoenix, Oracle, MongoDB, PostgreSQL/PostGIS, MySQL/MariaDB, data lakes, ELT pipelines.","Cloud & Systems: AWS EC2, RDS, DynamoDB, S3, Route 53, SES, Lambda, Linux, Java, NodeJS, React, Rust, Python, Ruby, PHP, Jetty, NGINX, Netlify.","Architecture Judgment: custom columnar data stores, large-scale ingestion, distributed analytics, event-driven processing, reconciliation workflows, secure content distribution, decentralized encryption, and human-review workflows."]},{"heading":"Leadership, Funding & Advisory Work","lines":["More than 10 years of engineering management experience across startups and public companies.","Served as CTO or technical founder across multiple startups, managing teams ranging from small research groups to multidisciplinary product organizations.","Served as CEO of Darkblock, managing executives, engineering, product development, marketing, and business development teams.","Raised $6M in venture and angel funding across three companies.","Mentor — I-Corps | Fall 2023, Spring 2024: advised new entrepreneurs on product-market fit assessment.","Mindshare Class of 2022."]},{"heading":"Education","lines":["Bachelor of Science in Mechanical Engineering — The Johns Hopkins University | 1998"]}]},"targetTitle":"Technical Founder / Platform Architect for VoW Core, Platform, and Product Suite","targetOrganization":"VoW / SHRM-aligned workforce intelligence platform","reviewerIntro":"For the VoW platform effort, the central question is whether Chris can turn a sensitive, data-rich workforce intelligence concept into a credible platform: one that respects governance boundaries, produces useful simulation outputs, and can become multiple products without losing technical coherence. His resume gives a practical answer: he has spent his career building search, retrieval, data fusion, corpus-scale analytics, and startup platforms where messy information has to become usable product infrastructure.","resumeBrief":"Chris is a founder-architect with deep hands-on experience in search engines, data platforms, RAG, entity resolution, evidence systems, and enterprise analytics. The redesigned resume foregrounds the parts most relevant to VoW: corpus ingestion, retrieval orchestration, inspectable AI outputs, graph/entity work, data platform modernization, and product leadership.","roleBrief":"The VoW stack needs a leader who can shape the simulation engine, ingest/prior pipeline, platform controls, and buyer-facing products while communicating clearly with SHRM, HR-X, advisory, research, and enterprise stakeholders. The role sits at the intersection of search/retrieval, data governance, platform architecture, product packaging, and executive trust.","strongestSignals":["Career-long search and retrieval depth, from web search and SOLR/ElasticSearch to RAG and long-context AI interaction.","Direct experience building data fusion, entity resolution, graph analysis, geospatial analytics, and investigative intelligence platforms.","Recent work maps closely to VoW’s needs: large-scale corpus ingestion, evidence comparison, inspectable outputs, calibration workflows, and simulation-oriented AI systems.","Founder and executive history shows he can move from architecture to fundraising, team leadership, product strategy, partnerships, and operating execution.","Enterprise data platform experience at Everbridge and Capital One supports credibility for governed, multi-system, high-volume environments."],"gaps":["The source material does not show direct HR, SHRM, workforce research, or nonprofit association platform experience; that domain expertise would need to come from SHRM-side partnership and governance.","The resume supports simulation-oriented AI systems and calibration workflows, but it does not prove production deployment of a workforce simulation engine at VoW scale.","Governance, consent, and ethics-tier implementation are central to VoW; Chris has adjacent experience in secure systems, enterprise data, and inspectable evidence, but the exact policy operating model would need to be co-designed with SHRM leadership."],"steps":[{"id":"step-1","title":"He has spent his career turning messy information into usable intelligence.","eyebrow":"Search → ingest → data fusion → evidence → decisions","narrative":"This is not just a recent Tenure or RAG pattern. Across search engines, social search, data fusion platforms, enterprise analytics, entity resolution, evidence workbenches, and AI platform work, Chris has repeatedly built systems that convert large, messy, fast-moving information into structured intelligence people can act on.","detailBlocks":[{"title":"Why this matters","body":"VoW depends on converting SHRM’s practitioner knowledge, panel signals, program data, client context, and validation feedback into a governed intelligence layer. Chris’s strongest fit is that he has worked on this class of problem for decades, under different labels and architectures.","kind":"standard"},{"title":"The role relevance","body":"The resume shows the pieces repeatedly: crawling, indexing, retrieval, NLP, graph analysis, entity resolution, ingest pipelines, analytics platforms, evidence comparison, calibration, and human-review workflows. VoW needs those pieces assembled into one coherent platform.","kind":"standard"},{"title":"Plain-English translation","body":"The simple version: Chris has spent years building systems that take huge amounts of messy information, find the parts that matter, connect related signals, and turn them into answers or products people can trust.","kind":"standard"}],"evidenceQuote":"Built multiple search and intelligence products from the ground up; led GRX data fusion across search, graph analysis, geospatial analytics, and machine learning; designed AI-assisted research and evidence workbenches for corpus ingestion, retrieval orchestration, evidence comparison, and human-review workflows.","whyItMatters":"This maps directly to VoW’s need to make proprietary knowledge operational: not as generic AI output, but as governed, source-aware, reusable intelligence.","fitLanguage":"Chris can credibly help build VoW because he has repeatedly built the same underlying machinery: ingest, retrieval, normalization, fusion, evidence handling, and product-facing intelligence.","caveat":"The resume does not show SHRM-specific corpus governance; that boundary should be established with SHRM data, legal, and research leadership.","confidence":"high","resumeAnchor":"Built multiple search and intelligence products from the ground up"},{"id":"step-2","title":"His search background is not incidental; it is the foundation for credible RAG and simulation.","eyebrow":"Search depth before AI fashion","narrative":"VoW’s outputs will only be as credible as the retrieval, ranking, segmentation, and context assembly behind them. Chris has built search systems across web, social, enterprise, television, and image-search contexts long before RAG became the current label.","detailBlocks":[{"title":"The useful signal","body":"He is not merely integrating AI APIs. His background includes crawlers, indexes, relevance, NLP, graph analysis, type-ahead, social search, and large-scale retrieval systems.","kind":"standard"},{"title":"Why it helps VoW","body":"A simulation platform needs to retrieve the right evidence, represent dissenting signals, and avoid flattening complex segments into a single answer. Search judgment is central to that.","kind":"standard"}],"evidenceQuote":"I have developed, from scratch, every part of the web search stack","whyItMatters":"VoW Core needs retrieval discipline: priors, segment cuts, source lineage, confidence, dissent, and evidence-aware outputs all depend on the search layer being strong.","fitLanguage":"Chris brings the kind of search-native technical judgment that can make VoW more than a wrapper around models.","caveat":"","confidence":"high","resumeAnchor":"web crawling, inverted indexes, SOLR, Elasticsearch, Lucene, OpenSearch, vector search, relevancy, clustering"},{"id":"step-3","title":"He has built data fusion products that resemble VoW’s intelligence layer.","eyebrow":"Search + graph + geospatial + ML in one product","narrative":"VoW is not a single dataset problem. It combines practitioner signals, workforce priors, client descriptors, attestations, longitudinal program data, and validation feedback. Chris has led products where varied sources had to be fused, searched, analyzed, and presented as intelligence.","detailBlocks":[{"title":"The relevant pattern","body":"At PlanetRisk and Everbridge, his work centered on data fusion, entity resolution, graph analysis, geospatial analytics, large-scale ingest, and enterprise analytics platforms.","kind":"standard"},{"title":"What this lets leadership trust","body":"He has seen the operational reality of stitching many imperfect sources together into a product, which is exactly where many AI strategies fail after the demo stage.","kind":"standard"}],"evidenceQuote":"data fusion SaaS product GRX, driving advancements in search, graph analysis, geospatial analytics, and machine learning in one product","whyItMatters":"VoW’s moat depends on turning many source families into reusable, versioned intelligence. Data fusion experience is directly relevant to making that work.","fitLanguage":"His data fusion background supports the architecture of a shared intelligence layer that multiple VoW products can call without each product reinventing the data model.","caveat":"","confidence":"high","resumeAnchor":"GRX, a data fusion SaaS platform combining search, graph analysis, geospatial analytics, and machine learning"},{"id":"step-4","title":"He understands enterprise data plumbing, not just algorithms.","eyebrow":"Pipelines, platforms, and operating discipline","narrative":"VoW needs platform reliability: versioned priors, ingestion cadence, lineage, APIs, tenancy, cost controls, and product profiles. Chris’s Everbridge and Capital One work shows experience in the unglamorous systems that make enterprise platforms dependable.","detailBlocks":[{"title":"Why this matters","body":"For SHRM, credibility will depend on whether outputs can be explained, refreshed, audited, and operated across products. That requires platform engineering discipline, not just model experimentation.","kind":"standard"},{"title":"Where the resume connects","body":"His experience includes streaming pipelines, data lakes, Snowflake, AWS Glue, Kafka, reconciliation, standardization, and event-driven systems.","kind":"standard"}],"evidenceQuote":"Led the architectural design of a new Data Analytics Platform integrating Kafka, S3, AWS Glue, Snowflake, and Looker.","whyItMatters":"VoW Platform will have to expose the Core safely to HR-X, advisory, research, benchmarks, Studio, and future APIs. The candidate has built shared data infrastructure across business needs before.","fitLanguage":"He can help design VoW as a durable platform with operating controls, rather than as a collection of disconnected pilots.","caveat":"The supplied resume does not specifically show implementation of ethics-tier release controls or nonprofit consent policy engines; those should be designed with governance stakeholders.","confidence":"high","resumeAnchor":"Designed a Data Analytics Platform integrating Kafka, S3, AWS Glue, Snowflake, and Looker"},{"id":"step-5","title":"He can carry the product from architecture into real organizational adoption.","eyebrow":"Founder, CEO, CTO, product owner","narrative":"VoW will require executive alignment, internal trust, product packaging, and technical credibility. Chris’s background is useful because he has not stayed only in the architect lane; he has raised capital, led teams, managed product direction, handled partnerships, and built products from concept to market.","detailBlocks":[{"title":"Why this matters","body":"A platform like VoW crosses research, product, advisory, HR-X, enterprise sales, legal, and partner ecosystems. The leader needs to translate between technical design and organizational confidence.","kind":"standard"},{"title":"The resume evidence","body":"His leadership record includes CEO, CTO, chief architect, engineering manager, product owner, and founder roles across early-stage and larger-company environments.","kind":"standard"}],"evidenceQuote":"Role type: mixture of engineering management, executive management, hands-on back-end development, architecture design, product management, and business development.","whyItMatters":"The role needs someone who can explain tradeoffs to executives, make build-vs-buy choices, manage teams, and still understand the machinery deeply enough to avoid fragile architecture.","fitLanguage":"Chris fits the founder-architect profile: technical enough to build the hard parts, senior enough to align stakeholders, and product-minded enough to keep the work pointed at adoption.","caveat":"","confidence":"high","resumeAnchor":"Drove product strategy, partnerships, fundraising, architecture, and operating execution"},{"id":"step-6","title":"His recent AI work lines up with VoW’s specific future, not just general AI enthusiasm.","eyebrow":"RAG, calibration, simulation, long-context systems","narrative":"The VoW concept calls for scenario simulation, ensemble outputs, uncertainty, calibration, prior refresh, and a bridge from simulation to validation. Chris’s recent independent work uses the same vocabulary of systems: RAG, evidence fusion, calibration workflows, inspectable reasoning, and enterprise decision support.","detailBlocks":[{"title":"RAG in plain English","body":"RAG means the system retrieves relevant source material first, then uses AI to produce an answer grounded in that evidence. For VoW, that matters because outputs need to be tied back to SHRM knowledge, not generic AI guesses.","kind":"standard"},{"title":"The case for fit","body":"This is the cleanest bridge from his resume to VoW Core: he has been working on AI systems that combine retrieval, evidence, calibration, and decision support rather than simple chatbot interfaces.","kind":"standard"},{"title":"How to position him","body":"He should be presented as someone who can help SHRM turn a proprietary knowledge advantage into an inspectable, productized AI platform with confidence limits and human review.","kind":"standard"}],"evidenceQuote":"multi-pass retrieval, evidence fusion, calibration workflows, and inspectable reasoning pipelines for enterprise decision support","whyItMatters":"VoW’s differentiation is a governed simulation engine informed by proprietary practitioner and panel reality. Chris’s recent work is directly adjacent to that operating model.","fitLanguage":"He has the technical pattern recognition to help define VoW Core and the product judgment to shape how it becomes HR-X, advisory, research, enterprise, and API offerings.","caveat":"The resume supports adjacent AI platform work; the exact VoW architecture, SHRM data rights, and product governance would still need executive sponsorship and domain partnership.","confidence":"high","resumeAnchor":"multi-pass retrieval, evidence fusion, calibration workflows, and inspectable reasoning pipelines for enterprise decision support"}],"closingNote":"The hiring case is straightforward: Chris brings rare depth in search, retrieval, data fusion, and platform architecture, plus enough founder and executive experience to work with senior nonprofit leadership. For VoW, his best use is not as a generic AI advisor; it is as the technical founder-architect who can help turn SHRM’s proprietary knowledge base into a governed, evidence-aware simulation and product platform.","termExplanations":{"RAG":"retrieval-augmented generation: an AI pattern that grounds answers in retrieved source material instead of relying only on model memory","retrieval":"finding the right evidence or records from a large corpus before generating an answer","entity resolution":"matching records that refer to the same person, organization, account, or concept across messy datasets","data fusion":"combining many imperfect data sources into one usable intelligence layer","priors":"the baseline beliefs or assumptions a simulation starts from before adding new client or scenario context","corpus":"a large body of source material, such as documents, survey responses, program data, or practitioner knowledge","calibration":"checking predictions against real outcomes and adjusting the system when it is wrong","lineage":"a trace of which sources and data versions supported an output"}}}</script>
<script>
(function () {
  const payload = JSON.parse(document.getElementById('data').textContent);
  const model = payload.model || {};
  const steps = Array.isArray(model.steps) ? model.steps : [];
  const polished = model.polishedResume || {};
  let active = 0;
  let activeEvidence = 0;
  let mode = 'walk';
  let tour = false;
  let promptVisible = false;
  let followFocusedEvidence = false;
  const root = document.getElementById('root');
  let promptTimer = window.setTimeout(() => {
    promptVisible = true;
    render();
  }, 3000);

  function esc(value) { return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function cleanTitle(value) {
    return String(value || '')
      .replace(/executive pattern/gi, 'career context')
      .replace(/strategic signal/gi, 'relevant signal')
      .replace(/leadership archetype/gi, 'leadership experience')
      .replace(/fit vector/gi, 'fit')
      .replace(/proof point/gi, 'evidence')
      .replace(/mental model/gi, 'starting point')
      .trim();
  }
  function normalize(value) { return String(value || '').toLowerCase().replace(/[^a-z0-9+#.]+/g, ' ').replace(/\s+/g, ' ').trim(); }
  function queryFor(step) {
    const values = [step.resumeAnchor, step.evidenceQuote, step.fitLanguage, step.narrative].map(v => String(v || '').trim()).filter(Boolean);
    return values.find(v => v && v !== 'Needs source evidence') || '';
  }
  function scoreLine(line, query) {
    const nLine = normalize(line);
    const nQuery = normalize(query);
    if (!nLine || !nQuery) return 0;
    if (nLine.includes(nQuery)) return 999;
    const words = nQuery.split(' ').filter(w => w.length > 3);
    if (!words.length) return 0;
    return words.filter(w => nLine.includes(w)).length;
  }
  function evidenceCandidates(sections, step) {
    const query = queryFor(step);
    const matches = [];
    sections.forEach((section, si) => (section.lines || []).forEach((line, li) => {
      const score = scoreLine(line, query);
      if (score >= 3 || score === 999) matches.push({ section: si, line: li, score, query });
    }));
    return matches.sort((a, b) => b.score - a.score);
  }
  function bestFocus(sections, step) {
    const matches = evidenceCandidates(sections, step);
    if (!matches.length) return { section: -1, line: -1, score: 0, query: queryFor(step) };
    return matches[Math.min(activeEvidence, matches.length - 1)];
  }
  function sectionsForDisplay() {
    const sections = Array.isArray(polished.sections) ? polished.sections : [];
    if (!sections.length) return [];
    const priority = [
      'Executive Fit for AI, Search & Enterprise Intelligence Platforms',
      'Technical Depth',
      'Professional Experience',
      'Leadership, Funding & Advisory Work',
      'Earlier Search, Data Mining & Startup Experience',
      'Education'
    ];
    const ordered = priority
      .map(heading => sections.find(section => section.heading === heading))
      .filter(Boolean);
    const used = new Set(ordered);
    return ordered.concat(sections.filter(section => !used.has(section)));
  }
  const keyPhrases = [
    'large-scale search engines',
    'data platforms',
    'AI/ML applications',
    'enterprise data platforms',
    'search and retrieval systems',
    'entity resolution',
    'geospatial intelligence',
    'Built multiple search and intelligence products from the ground up',
    'enterprise data fusion platforms',
    'AI-assisted research systems',
    'RAG platforms',
    'evidence workbenches',
    'corpus ingestion',
    'retrieval orchestration',
    'inspectable outputs',
    'evidence comparison',
    'human-review workflows',
    'simulation-oriented AI systems',
    'multi-pass retrieval',
    'evidence fusion',
    'calibration workflows',
    'inspectable reasoning pipelines',
    'Data Analytics Platform',
    'Kafka, S3, AWS Glue, Snowflake, and Looker',
    'GRX, a data fusion SaaS platform',
    'search, graph analysis, geospatial analytics, and machine learning',
    'custom entity resolution algorithms',
    'large-scale ingest systems',
    'billions of records daily',
    'PersoniFind',
    '500 million users',
    '40 billion social connections',
    'web crawling, inverted indexes',
    'vector search',
    'RAG architectures',
    'long-context interaction',
    'entity and identity resolution',
    'data lakes',
    'event-driven processing',
    'reconciliation workflows'
  ];
  function emphasizeTerms(text) {
    const source = String(text || '');
    const phrases = keyPhrases
      .map(phrase => ({ phrase, index: source.indexOf(phrase) }))
      .filter(item => item.index >= 0)
      .sort((a, b) => a.index - b.index || b.phrase.length - a.phrase.length);
    if (!phrases.length) return esc(source);
    let output = '';
    let cursor = 0;
    for (const item of phrases) {
      if (item.index < cursor) continue;
      output += esc(source.slice(cursor, item.index));
      output += '<strong class="resume-key">' + esc(item.phrase) + '</strong>';
      cursor = item.index + item.phrase.length;
    }
    return output + esc(source.slice(cursor));
  }
  function renderLine(line, isFocus) {
    const bullet = /^[-•*]\s+/.test(line);
    const text = bullet ? line.replace(/^[-•*]\s+/, '') : line;
    const renderedText = emphasizeTerms(text);
    return '<p class="line ' + (bullet ? 'bullet ' : '') + (isFocus ? 'focus' : '') + '">' + (isFocus ? '<mark>' + renderedText + '</mark>' : renderedText) + '</p>';
  }
  function renderResume(step) {
    const sections = sectionsForDisplay();
    const focus = tour && mode === 'walk' ? bestFocus(sections, step || {}) : { section: -1, line: -1 };
    const candidates = tour && mode === 'walk' ? evidenceCandidates(sections, step || {}) : [];
    if (activeEvidence >= candidates.length) activeEvidence = 0;
    return sections.map((section, si) => {
      const sectionHasFocus = focus.section === si;
      const dimSection = tour && mode === 'walk' && focus.section >= 0 && !sectionHasFocus;
      return '<section class="resume-section ' + (dimSection ? 'dim-section' : '') + '">' +
        (section.heading ? '<h2>' + esc(section.heading) + '</h2>' : '') +
        (section.lines || []).map((line, li) => {
          const isFocus = tour && mode === 'walk' && focus.section === si && focus.line === li;
          const dim = tour && mode === 'walk' && focus.section >= 0 && !isFocus;
          const rendered = renderLine(line, isFocus);
          return rendered.replace('class="line ', 'class="line ' + (dim ? 'dim ' : ''));
        }).join('') +
      '</section>';
    }).join('');
  }
  function blocks(step) {
    if (Array.isArray(step.detailBlocks) && step.detailBlocks.length) return step.detailBlocks.filter(b => b && (b.title || b.body));
    return [
      { title: 'What to take away', body: step.whyItMatters },
      { title: 'How it maps to the role', body: step.fitLanguage },
      { title: 'Where to be careful', body: step.caveat, kind: 'caveat' }
    ].filter(b => String(b.body || '').trim());
  }
  function renderCoach(step) {
    const evidenceCount = evidenceCandidates(sectionsForDisplay(), step).length;
    const evidenceLabel = evidenceCount > 1 ? ' · evidence ' + (Math.min(activeEvidence, evidenceCount - 1) + 1) + ' of ' + evidenceCount : '';
    return '<aside class="coach"><article class="coach-card">' +
      '<div class="coach-top"><span class="step-count">Step ' + (active + 1) + ' of ' + Math.max(steps.length, 1) + evidenceLabel + '</span><div class="step-buttons"><button data-prev ' + (active === 0 && activeEvidence === 0 ? 'disabled' : '') + '>Back</button><button class="next" data-next ' + (active >= steps.length - 1 && activeEvidence >= Math.max(evidenceCount - 1, 0) ? 'disabled' : '') + '>Next</button></div></div>' +
      '<div class="eyebrow-row"><span>' + esc(step.eyebrow || 'What to notice') + '</span><span class="confidence">' + esc(step.confidence || 'review') + '</span></div>' +
      '<h2>' + esc(cleanTitle(step.title || 'Resume fit')) + '</h2>' +
      '<p class="narrative">' + esc(step.narrative || '') + '</p>' +
      '<div class="insights">' + blocks(step).map(block => '<div class="insight ' + (block.kind === 'caveat' ? 'caveat' : '') + '"><strong>' + esc(cleanTitle(block.title || 'Note')) + '</strong><p>' + esc(block.body || '') + '</p></div>').join('') + '</div>' +
      renderTerms(step) +
      '<details class="source-box" open><summary>Source evidence</summary><p>' + esc(step.evidenceQuote || step.resumeAnchor || 'Evidence should be confirmed against source resume text.') + '</p></details>' +
      '<div class="nav-dots">' + steps.map((_, i) => '<button data-step="' + i + '" class="' + (i === active ? 'active' : '') + '">' + (i + 1) + '</button>').join('') + '</div>' +
    '</article></aside>';
  }
  function renderTerms(step) {
    const terms = model.termExplanations || {};
    const haystack = [step.title, step.eyebrow, step.narrative, step.evidenceQuote, ...(step.detailBlocks || []).flatMap(block => [block.title, block.body])].join(' ').toLowerCase();
    const selected = Object.entries(terms).filter(([term]) => haystack.includes(term.toLowerCase())).slice(0, 4);
    if (!selected.length) return '';
    return '<details class="terms-box"><summary>Key terms</summary><dl>' + selected.map(([term, meaning]) => '<div><dt>' + esc(term) + '</dt><dd>' + esc(meaning) + '</dd></div>').join('') + '</dl></details>';
  }
  function renderBrief() {
    return '<section class="brief">' +
      card(model.targetTitle || 'Fit brief', model.reviewerIntro || model.closingNote || '') +
      card('Resume in one paragraph', model.resumeBrief || '') +
      card('What the role needs', model.roleBrief || '') +
      listCard('Strongest hiring signals', model.strongestSignals || []) +
      listCard('Gaps to handle honestly', model.gaps || []) +
    '</section>';
  }
  function card(title, body) { return '<article class="brief-card"><h2>' + esc(title) + '</h2><p>' + esc(body) + '</p></article>'; }
  function listCard(title, items) { return '<article class="brief-card"><h3>' + esc(title) + '</h3><ul>' + items.map(item => '<li>' + esc(item) + '</li>').join('') + '</ul></article>'; }
  function renderLaunch() {
    if (!promptVisible || tour || mode !== 'walk') return '';
    return '<aside class="launch"><strong>Why Chris is a great fit to build out the VoW platform</strong><p>Open the guided overlay to see the resume evidence mapped directly to the platform work.</p><button class="pill-button primary" data-start>Show the fit</button></aside>';
  }
  function render() {
    const step = steps[active] || {};
    const activeTour = tour && mode === 'walk';
    root.className = (activeTour ? 'is-tour ' : 'is-start ') + 'mode-' + mode + (promptVisible ? ' prompt-visible' : '');
    root.innerHTML = '<main class="shell">' +
      '<nav class="topbar"><div class="context"><strong>' + esc(polished.name || model.candidateName || 'Candidate') + '</strong><span>' + esc(model.targetTitle || 'Role fit review') + (model.targetOrganization ? ' · ' + esc(model.targetOrganization) : '') + '</span></div><div class="top-actions"><button class="pill-button ' + (mode === 'walk' ? 'active' : '') + '" data-mode="walk">Interactive View</button><button class="pill-button ' + (mode === 'resume' ? 'active' : '') + '" data-mode="resume">Resume Only View</button><button class="pill-button" data-save-pdf>Save as PDF</button></div></nav>' +
      '<section class="stage"><div class="resume-wrap"><article class="resume-paper"><header class="resume-header"><div><p class="resume-kicker">Tailored interactive resume</p><h1>' + esc(polished.name || model.candidateName || 'Candidate') + '</h1></div><p class="resume-headline">' + esc(polished.headline || model.candidateHeadline || '') + '</p></header>' +
      (polished.contactLine ? '<p class="contact">' + esc(polished.contactLine) + '</p>' : '') +
      (polished.summary ? '<p class="summary">' + esc(polished.summary) + '</p>' : '') + renderResume(step) + '</article></div><div class="walkthrough-wrap">' + renderLaunch() + renderCoach(step) + '</div></section>' +
      renderBrief() + '</main>';
    window.setTimeout(() => {
      const focused = document.querySelector('.line.focus');
      if (!focused || !tour || mode !== 'walk') return;
      const mobileResumePane = window.matchMedia('(max-width: 720px)').matches ? document.querySelector('.resume-wrap') : null;
      if (mobileResumePane) {
        const paneRect = mobileResumePane.getBoundingClientRect();
        const rect = focused.getBoundingClientRect();
        const comfortablyVisible = rect.top > paneRect.top + 42 && rect.bottom < paneRect.bottom - 42;
        if (!comfortablyVisible) {
          mobileResumePane.scrollBy({
            top: rect.top - paneRect.top - (paneRect.height / 2) + (rect.height / 2),
            behavior: 'smooth'
          });
        }
        return;
      }
      const rect = focused.getBoundingClientRect();
      const comfortablyVisible = rect.top > 96 && rect.bottom < window.innerHeight - 40;
      if (!comfortablyVisible && followFocusedEvidence) {
        window.scrollTo({
          top: Math.max(0, window.scrollY + rect.top - 150),
          behavior: 'smooth'
        });
      }
      followFocusedEvidence = false;
    }, 30);
  }
  function startTour() { window.clearTimeout(promptTimer); promptVisible = false; tour = true; mode = 'walk'; render(); }
  root.addEventListener('click', event => {
    const target = event.target;
    if (!target || !target.matches) return;
    if (target.matches('[data-start]')) startTour();
    if (target.matches('[data-save-pdf]')) {
      mode = 'resume';
      tour = false;
      promptVisible = false;
      render();
      window.setTimeout(() => window.print(), 100);
    }
    if (target.matches('[data-prev]')) previousHighlight(); 
    if (target.matches('[data-next]')) nextHighlight();
    if (target.matches('[data-step]')) { active = Number(target.getAttribute('data-step')) || 0; activeEvidence = 0; followFocusedEvidence = true; startTour(); }
    if (target.matches('[data-mode]')) {
      mode = target.getAttribute('data-mode') || 'walk';
      if (mode === 'walk' && tour) startTour();
      else render();
    }
  });
  document.addEventListener('keydown', event => {
    if (!tour || mode !== 'walk') return;
    if (event.key === 'ArrowRight') nextHighlight();
    if (event.key === 'ArrowLeft') previousHighlight();
  });
  function currentEvidenceCount() {
    return evidenceCandidates(sectionsForDisplay(), steps[active] || {}).length;
  }
  function nextHighlight() {
    const count = currentEvidenceCount();
    if (activeEvidence < count - 1) activeEvidence += 1;
    else {
      active = Math.min(Math.max(steps.length - 1, 0), active + 1);
      activeEvidence = 0;
    }
    followFocusedEvidence = true;
    startTour();
  }
  function previousHighlight() {
    if (activeEvidence > 0) activeEvidence -= 1;
    else {
      active = Math.max(0, active - 1);
      activeEvidence = Math.max(0, evidenceCandidates(sectionsForDisplay(), steps[active] || {}).length - 1);
    }
    followFocusedEvidence = true;
    startTour();
  }
  render();
  if (window.location.hash === '#tour') window.setTimeout(startTour, 50);
})();
</script>
</body>
</html>
